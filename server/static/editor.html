<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Studio · 配置编辑器</title>
<link rel="stylesheet" href="/static/editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <b>NPC Studio</b>
    <span>配置编辑器</span>
  </div>
  <div class="actions">
    <select id="npcSelect">
      <option value="guard_base">guard_base</option>
      <option value="elite_guard">elite_guard</option>
    </select>
    <button id="btnReload">重新加载</button>
    <button id="btnExportCsv">导出 DataTable</button>
    <button id="btnExportDoc">导出文档</button>
    <button id="btnSave" class="primary">保存</button>
    <a class="link" href="/">返回演示 →</a>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div id="tree"></div>
  </aside>

  <section class="form-pane">
    <div id="formEmpty" class="empty">从左侧选择一个状态</div>
    <div id="form" class="form" hidden></div>
  </section>

  <section class="json-pane">
    <div class="pane-head"><span>JSON 预览</span><span id="jsonMeta" class="meta"></span></div>
    <pre id="jsonView" class="json"></pre>
    <div class="pane-head"><span>校验结果</span></div>
    <div id="issues" class="issues"><span class="muted">尚未保存</span></div>
  </section>
</main>

<script src="/static/editor.js"></script>
</body>
</html>
