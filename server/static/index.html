<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPC Studio · 运行时演示</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="view" width="600" height="600"></canvas>
    <div class="legend">
      <span><i class="dot npc"></i>守卫</span>
      <span><i class="dot player"></i>玩家</span>
      <span><i class="ring"></i>视野 8m</span>
      <span><i class="ring red"></i>攻击 2m</span>
    </div>
  </div>

  <aside class="panel">
    <h1>NPC Studio <a class="edit-link" href="/editor">编辑器 →</a></h1>
    <p class="sub">AI NPC 行为配置工作台 · 运行时演示</p>

    <div class="metrics">
      <div class="metric"><span>时间</span><b id="time">0.0s</b></div>
      <div class="metric"><span>距离</span><b id="dist">-</b></div>
    </div>

    <h2>三层状态</h2>
    <div id="layers" class="layers"></div>

    <h2>能力锁</h2>
    <div id="locks" class="locks"></div>

    <h2>转移历史</h2>
    <div id="history" class="history"></div>

    <h2>本帧事件</h2>
    <div id="events" class="events"></div>

    <h2>对话</h2>
    <div id="chatlog" class="chatlog"></div>
    <div class="chat-input">
      <input id="msg" placeholder="对守卫说点什么…" autocomplete="off">
      <button id="send">发送</button>
    </div>

    <p class="hint">WASD / 方向键移动 · E 与 NPC 交互</p>
  </aside>
</div>
<script src="/static/game.js"></script>
</body>
</html>
